# One service: the API. The cache lives in db/cache.sqlite3, which
# `docker compose` creates on first boot — there is no second container and no
# Redis to install.
#
#   cp .env.sample .env    # add your provider keys
#   docker compose up

services:
  web:
    build: .
    ports:
      - '3000:3000'
    # `.env` is gitignored and may not exist yet, so it is marked optional
    # rather than required. Without it the app still boots — it just has no
    # provider credentials.
    env_file:
      - path: .env
        required: false
    volumes:
      # Keep the cache database across restarts. Losing it costs one cold
      # search, not correctness.
      - cache:/app/db
    restart: unless-stopped

volumes:
  cache:
