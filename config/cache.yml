default: &default
  store_options:
    # Cap age of the oldest cache entry, so a forgotten key cannot sit forever.
    max_age: <%= 7.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  database: <%= ENV.fetch("DATABASE", "cache") %>
  <<: *default
